# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "namtor-kde"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "KDE System Settings KCM bridge for Nam-tor face profile management"

# `cdylib` produces libnamtor_kde.so for the C++ KCModule shim to link/dlopen
# (Task 21 build scaffolding); `rlib` keeps the crate usable as a normal Rust
# dependency by the contract suite and the GNOME UI tests.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
namtor-client = { path = "../namtor-client" }
serde = { workspace = true }
tracing = "0.1"
zbus = { version = "5", default-features = false, features = [
    "async-io",
    "p2p",
    "uuid",
    "option-as-array",
] }

[dev-dependencies]
futures-util = "0.3"
serde_json = "1"
