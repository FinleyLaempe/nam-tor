[package]
name = "namtor-kde"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "KDE System Settings KCM bridge for Nam-tor face profile management"

[dependencies]
serde = { workspace = true }
tracing = "0.1"
zbus = { version = "5", default-features = false, features = [
    "async-io",
    "p2p",
    "uuid",
    "option-as-array",
] }

[dev-dependencies]
futures-util = "0.3"
