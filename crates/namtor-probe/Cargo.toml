[package]
name = "namtor-probe"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"

[dependencies]
namtor-hwdb = { path = "../namtor-hwdb" }
namtor-uvc = { path = "../namtor-uvc" }
namtor-capture = { path = "../namtor-capture" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "namtor-probe"
path = "src/bin/namtor-probe.rs"
