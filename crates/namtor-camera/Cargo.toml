[package]
name = "namtor-camera"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-only"

[dependencies]
namtor-uvc = { path = "../namtor-uvc" }
namtor-hwdb = { path = "../namtor-hwdb" }
namtor-capture = { path = "../namtor-capture" }
thiserror = { workspace = true }
toml = "0.8"
zbus = { version = "5", features = ["blocking"] }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "namtor-camera-emitter-off"
path = "src/bin/namtor-camera-emitter-off.rs"
