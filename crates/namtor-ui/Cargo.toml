[package]
name = "namtor-ui"
version = "0.3.3"
edition.workspace = true
license.workspace = true
description = "Nam-tor management UI — GTK4/libadwaita, desktop-neutral — D-Bus client (org.namtor.Manager)"

[lib]
path = "src/lib.rs"

[features]
default = ["dbus"]
dbus = ["dep:zbus"]

[dependencies]
namtor-proto = { path = "../namtor-proto" }
namtor-client = { path = "../namtor-client" }
namtor-hwdb = { path = "../namtor-hwdb" }
namtor-layout = { path = "../namtor-layout" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
gtk4 = "0.9"
libadwaita = { version = "0.7", features = ["v1_5"] }
gio = "0.20"
glib = "0.20"
gettext = "0.4.0"
nix = { version = "0.29", features = ["user"] }
zbus = { version = "5.18", features = ["option-as-array"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "namtor-enroll-wizard"
path = "src/bin/wizard.rs"
required-features = ["dbus"]
