[package]
name = "namtor-store"
version = "0.3.4"
edition.workspace = true
license.workspace = true

[features]
# Real TPM2 backend via the tpm2-tools CLI. Off by default so the default
# build does not require tpm2-tools at runtime; CI enables it for the
# hardware-gated TPM tests (NAMTOR_HW_TEST=1).
tpm2 = []

[dependencies]
namtor-proto = { path = "../namtor-proto" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rand = "0.8"
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
