[package]
name = "namtor-pam"
version = "0.3.8"
edition.workspace = true
license.workspace = true
description = "PAM module for Nam-tor face authentication — fail-closed, no ML"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
namtor-proto = { path = "../namtor-proto" }
libc = "0.2"
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
namtor-daemon = { path = "../namtor-daemon" }
namtor-layout = { path = "../namtor-layout" }
namtor-proto = { path = "../namtor-proto" }
nix = { version = "0.29", features = ["user"] }
