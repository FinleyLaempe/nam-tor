[package]
name = "namtor-worker"
version = "0.3.6"
edition.workspace = true
license = "GPL-3.0-only"

[dependencies]
landlock = "0.4"
libc = "0.2"
libseccomp = "0.4"
namtor-capture = { path = "../namtor-capture" }
namtor-layout = { path = "../namtor-layout" }
namtor-proto = { path = "../namtor-proto" }
nix = { version = "0.29", features = ["fs", "mman", "process", "socket", "user"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# ort + ndarray are only needed for the real OnnxCpu backend (the `onnx`
# feature, on by default). The `mock-infer` feature turns the backend off and
# drops these deps entirely, so CI test builds pull no ONNX Runtime and no
# model weights.
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "tls-rustls",
], optional = true }

[dev-dependencies]
namtor-capture = { path = "../namtor-capture" }
tempfile = { workspace = true }

[features]
default = ["onnx"]
# Real OnnxCpu backend backed by the ort crate (ONNX Runtime, CPU EP).
# AVX-VNNI is auto-detected by the CPU EP; no explicit flag. ort bundles
# ONNX Runtime statically via its `download-binaries` feature.
onnx = ["dep:ort"]
# Use the deterministic MockBackend instead of OnnxCpu. CI and the M3 e2e
# harness enable this so tests run with no ONNX Runtime and no model weights.
mock-infer = []
# Optional OpenVINO CPU backend evaluator (Task 31). OFF by default. Enabling
# this flag ONLY makes the `BackendKind::OpenVino` variant available for
# ablation reporting — it does NOT wire a real OpenVINO backend into the auth
# path, change the default backend, or relax the sandbox. Promotion is still
# gated by `run_ablation` on predeclared accuracy + latency + sandbox parity.
openvino = []
# Optional R100 (RidgeRun / custom CPU EP) backend evaluator (Task 31). Same
# semantics as `openvino`: variant-only, OFF by default, no default change.
r100 = []
