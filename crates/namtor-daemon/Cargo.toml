[package]
name = "namtor-daemon"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-only"

[features]
default = []
network = ["dep:reqwest"]

[dependencies]
namtor-proto = { path = "../namtor-proto" }
namtor-capture = { path = "../namtor-capture" }
namtor-camera = { path = "../namtor-camera" }
namtor-hwdb = { path = "../namtor-hwdb" }
namtor-worker = { path = "../namtor-worker", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
nix = { version = "0.29", features = ["fs", "process", "socket", "user"] }
rand = "0.8"
sha2 = "0.10"
tracing = "0.1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "namtor-daemon"
path = "src/bin/namtor-daemon.rs"
