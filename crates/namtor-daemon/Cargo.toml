[package]
name = "namtor-daemon"
version = "0.3.8"
edition.workspace = true
license = "GPL-3.0-only"

[features]
default = []
network = ["dep:reqwest"]

[dependencies]
namtor-proto = { path = "../namtor-proto" }
namtor-capture = { path = "../namtor-capture" }
namtor-camera = { path = "../namtor-camera" }
namtor-hwdb = { path = "../namtor-hwdb" }
namtor-worker = { path = "../namtor-worker", default-features = false }
namtor-store = { path = "../namtor-store" }
namtor-pad = { path = "../namtor-pad" }
namtor-recog = { path = "../namtor-recog" }
namtor-uvc = { path = "../namtor-uvc" }
namtor-layout = { path = "../namtor-layout" }
namtor-pam-config = { path = "../namtor-pam-config" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = "0.8"
nix = { version = "0.29", features = ["fs", "process", "signal", "socket", "user"] }
rand = "0.8"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false, optional = true }
zbus = { version = "5.18", features = ["p2p"] }
zeroize = { version = "1", features = ["derive"] }
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
# Test-only: the guidance wire round-trip test parses the daemon's emitted
# snake_case strings with the real client-side parser, so a drift between the
# two tables fails the daemon's own test suite.
namtor-client = { path = "../namtor-client" }
namtor-eval = { path = "../namtor-eval" }
namtor-worker = { path = "../namtor-worker", features = ["onnx"] }
namtor-capture = { path = "../namtor-capture" }
namtor-proto = { path = "../namtor-proto" }
