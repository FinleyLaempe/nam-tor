[package]
name = "namtor-cli"
version = "0.3.2"
edition.workspace = true
license = "GPL-3.0-only"

[dependencies]
namtor-camera = { path = "../namtor-camera" }
namtor-capture = { path = "../namtor-capture" }
namtor-hwdb = { path = "../namtor-hwdb" }
namtor-proto = { path = "../namtor-proto" }
namtor-store = { path = "../namtor-store" }
namtor-recog = { path = "../namtor-recog" }
namtor-uvc = { path = "../namtor-uvc" }
namtor-pam = { path = "../namtor-pam" }
namtor-layout = { path = "../namtor-layout" }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", features = ["fs", "user"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
zbus = { version = "5.18", default-features = false, features = ["blocking"] }
zvariant = { version = "5", default-features = false }
signal-hook = "0.3"

[dev-dependencies]
tempfile = { workspace = true }
serde_json = "1"
