[package]
name = "namtor-cli"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-only"

[dependencies]
namtor-camera = { path = "../namtor-camera" }
namtor-hwdb = { path = "../namtor-hwdb" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "namtor-cli"
path = "src/bin/namtor-cli.rs"
