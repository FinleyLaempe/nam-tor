[package]
name = "namtor"
version = "0.3.7"
edition.workspace = true
license = "GPL-3.0-only"
description = "Nam-tor — single multi-call executable: daemon, sandboxed worker, CLI, emitter-off, PAM editor"

[dependencies]
namtor-camera = { path = "../namtor-camera" }
namtor-cli = { path = "../namtor-cli" }
namtor-daemon = { path = "../namtor-daemon" }
namtor-layout = { path = "../namtor-layout" }
namtor-pam-config = { path = "../namtor-pam-config" }
namtor-worker = { path = "../namtor-worker", features = ["onnx"] }

[dev-dependencies]
tempfile = { workspace = true }
namtor-capture = { path = "../namtor-capture" }
namtor-proto = { path = "../namtor-proto" }

[[bin]]
name = "namtor"
path = "src/main.rs"
