# ---------------------------------------------------------------------------
# Shared lifecycle helper (Task 19). Every distro install hook (Arch
# .install, Fedora .spec, Debian maintainer scripts) delegates its typed
# phases (pre/post install/upgrade/remove) to this script. It validates
# model layout/hashes, identities/dirs, socket + D-Bus services, drives
# `namtor-pam-edit` for snapshot/migrate/disable-all/purge, and emits a
# receipt per phase. PAM is default-off: post-install never edits /etc/pam.d.
# ---------------------------------------------------------------------------
[[files]]
dest = "/usr/share/namtor/lifecycle.sh"
src = "packaging/lifecycle.sh"
mode = "0755"
owner = "root"
group = "root"
symlink = false
package = "core"

