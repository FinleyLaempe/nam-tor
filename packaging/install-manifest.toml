# SPDX-License-Identifier: GPL-3.0-only
# Nam-tor install manifest — versioned DESTDIR staging source of truth.
#
# `packaging/stage.sh` reads this file and produces a deterministic file tree
# under an empty DESTDIR: every path, mode, owner, group and source is
# declared here. Running staging twice into two empty roots yields identical
# trees (same paths, modes, owners, content sha256) — proven in
# `docs/evidence/install-manifest.json`.
#
# Schema:
#   schema_version  u32   — bump on any breaking change to this file's shape.
#                           The daemon's model-manifest loader is independent;
#                           this version governs packaging migrations only.
#
#   [retention]
#     purge_owner        string   — which package (core|gnome|kde) owns the
#                                   purge of biometric state (templates,
#                                   models cache, backoff).
#
#   [[generated_state]]
#     path               string   — a runtime-generated state path (not an
#                                   installed file). Created by the daemon at
#                                   runtime; lifecycle declared here.
#     package            string   — core|gnome|kde
#     on_upgrade         string   — "preserve" | "remove"
#     on_purge           string   — "preserve" | "remove"
#
#   [[dirs]]        path, mode, owner, group, package
#                   A directory to create. No source. `package` declares
#                   which split package owns this directory.
#
#   [[files]]       dest, src, mode, owner, group, symlink, package
#                   A regular file copied from `src` (relative to the repo
#                   root / SRCDIR) to `dest`. `symlink = true` creates a
#                   symlink dest -> src instead of copying (src is the link
#                   target as stored on the installed system). `package`
#                   declares which split package owns this file.
#
# Split packages:
#   core  — namtor (daemon, worker, PAM, CLI, models, services, SBOM, notice)
#   gnome — namtor-gnome (GTK4/libadwaita wizard + settings)
#   kde   — namtor-kde (Plasma 6 KCM desktop integration files)
#
# Shared directories (e.g. /usr/share/applications) are owned by core; GNOME
# and KDE each own only their own files dropped into them.
#
# Modes are octal strings ("0755", "0644"). Owners/groups are
# resolved by name at install time (root must run staging to chown; non-root
# staging leaves ownership as the invoking user and emits a warning — modes
# and content are still deterministic, which is what the evidence gate checks).

schema_version = 2

# ---------------------------------------------------------------------------
# Retention — core owns biometric state purge
# ---------------------------------------------------------------------------
[retention]
purge_owner = "core"

# ---------------------------------------------------------------------------
# Generated state — runtime paths created by the daemon, not installed files.
# Lifecycle: preserve on upgrade (keep biometric templates across versions),
# remove on purge (biometric data is destroyed when the package is removed).
# ---------------------------------------------------------------------------
[[generated_state]]
path = "/var/lib/namtor/templates"
package = "core"
on_upgrade = "preserve"
on_purge = "remove"

[[generated_state]]
path = "/var/lib/namtor/templates.key"
package = "core"
on_upgrade = "preserve"
on_purge = "remove"

[[generated_state]]
path = "/var/lib/namtor/models"
package = "core"
on_upgrade = "preserve"
on_purge = "remove"

[[generated_state]]
path = "/var/lib/namtor/backoff.json"
package = "core"
on_upgrade = "preserve"
on_purge = "remove"

