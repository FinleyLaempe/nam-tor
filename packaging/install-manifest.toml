# SPDX-License-Identifier: GPL-3.0-only
# Nam-tor install manifest — versioned DESTDIR staging source of truth.
#
# `packaging/stage.sh` reads this file and produces a deterministic file tree
# under an empty DESTDIR: every path, mode, owner, group and source is
# declared here. Running staging twice into two empty roots yields identical
# trees (same paths, modes, owners, content sha256) — proven in
# `docs/evidence/install-manifest.json`.
#
# Schema:
#   schema_version  u32   — bump on any breaking change to this file's shape.
#                           The daemon's model-manifest loader is independent;
#                           this version governs packaging migrations only.
#
#   [[dirs]]        path, mode, owner, group
#                   A directory to create. No source.
#
#   [[files]]       dest, src, mode, owner, group, symlink
#                   A regular file copied from `src` (relative to the repo
#                   root / SRCDIR) to `dest`. `symlink = true` creates a
#                   symlink dest -> src instead of copying (src is the link
#                   target as stored on the installed system).
#
# Modes are octal strings ("0755", "0644", "4755"). Owners/groups are
# resolved by name at install time (root must run staging to chown; non-root
# staging leaves ownership as the invoking user and emits a warning — modes
# and content are still deterministic, which is what the evidence gate checks).

schema_version = 1

# ---------------------------------------------------------------------------
# Directories
# ---------------------------------------------------------------------------
[[dirs]]
path = "/usr/lib/namtor"
mode = "0755"
owner = "root"
group = "root"

[[dirs]]
path = "/usr/lib/security"
mode = "0755"
owner = "root"
group = "root"

[[dirs]]
path = "/usr/share/namtor"
mode = "0755"
owner = "root"
group = "root"

[[dirs]]
path = "/var/lib/namtor"
mode = "0750"
owner = "namtor"
group = "namtor"

[[dirs]]
path = "/var/lib/namtor/models"
mode = "0750"
owner = "namtor"
group = "namtor"

[[dirs]]
path = "/var/lib/namtor/templates"
mode = "0750"
owner = "namtor"
group = "namtor"

# ---------------------------------------------------------------------------
# Binaries (built artifacts — src is relative to the repo root / SRCDIR)
# ---------------------------------------------------------------------------
[[files]]
dest = "/usr/lib/namtor/namtor-daemon"
src = "target/release/namtor-daemon"
mode = "0755"
owner = "root"
group = "root"
symlink = false

[[files]]
dest = "/usr/lib/namtor/namtor-worker"
src = "target/release/namtor-worker"
mode = "0755"
owner = "root"
group = "root"
symlink = false

[[files]]
dest = "/usr/lib/namtor/namtor-worker-spawn"
src = "target/release/namtor-worker-spawn"
mode = "4755"
owner = "root"
group = "root"
symlink = false

[[files]]
dest = "/usr/lib/namtor/namtor-camera-emitter-off"
src = "target/release/namtor-camera-emitter-off"
mode = "0755"
owner = "root"
group = "root"
symlink = false

[[files]]
dest = "/usr/bin/namtor-cli"
src = "target/release/namtor-cli"
mode = "0755"
owner = "root"
group = "root"
symlink = false

# GNOME management UI binary (GTK4 + libadwaita enrollment wizard).
[[files]]
dest = "/usr/bin/namtor-enroll-wizard"
src = "target/release/namtor-enroll-wizard"
mode = "0755"
owner = "root"
group = "root"
symlink = false

# PAM module (cdylib). The build produces `libpam_namtor.so`; it is installed
