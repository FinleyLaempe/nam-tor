# Nam-tor runtime directories (tmpfiles.d)
#
# /var/lib/namtor          — daemon home, owned by the daemon user
# /var/lib/namtor/models   — ONNX model files (YuNet, SFace, MiniFASNet PAD)
#                            readable by the daemon user only; group access
#                            is not needed since the worker inherits the
#                            daemon's supplementary groups.
# /var/lib/namtor/templates — encrypted template store (biometric data).
#                            0700: only the daemon user may traverse or read.
#                            This is the strictest defensible mode — even
#                            root bypasses it, but root can re-enroll.
# /run/namtor              — PAM socket dir, owned by root:namtor-auth so
#                            only group members may connect; mode 0750 keeps
#                            the path traversable for the socket group but
#                            no one else.

d /var/lib/namtor          0750 namtor namtor -
d /var/lib/namtor/models   0750 namtor namtor -
d /var/lib/namtor/templates 0700 namtor namtor -
d /run/namtor              0750 root   namtor-auth -
