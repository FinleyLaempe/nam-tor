# Nam-tor runtime directories (tmpfiles.d)
#
# /var/lib/namtor  — model store, owned by the daemon user
# /run/namtor      — PAM socket dir, owned by root:namtor-auth so only
#                    group members may connect; mode 0750 keeps the path
#                    traversable for the socket group but no one else.

d /var/lib/namtor 0750 namtor namtor -
d /run/namtor     0750 root   namtor-auth -
