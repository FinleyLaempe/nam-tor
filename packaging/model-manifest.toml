# SPDX-License-Identifier: GPL-3.0-only
# Nam-tor model manifest — signed source of truth for deployed ONNX models.
#
# The daemon loads this at startup (`namtor-daemon::models::ModelManifest`)
# and validates every deployed model against it before the worker loads any
# weights:
#
#   1. sha256 of the on-disk file MUST match the manifest variant's sha256
#      (tampered model blocks startup — fail closed).
#   2. the upstream licence MUST be accepted (`licence.accepted` record on
#      disk, written under NAMTOR_ACCEPT_LICENCE=1). Unaccepted blocks startup.
#   3. redistribution_policy = "restricted" models require explicit
#      authorisation (ManifestGate { allow_restricted: true }) or they block.
#
# If all three gates pass for every required model, the daemon starts without
# network access (valid offline cache). See `docs/evidence/install-manifest.json`
# for the gate test results.
#
# Signature verification (GPG/cosign over this file) is task 6 — this task
# defines the manifest format and the daemon-side sha256 + licence +
# redistribution validation. The fields required for signing (sha256 per
# variant, licence_sha256) are present so task 6 only adds verification.
#
# Schema:
#   manifest_version  u32
#
#   [[models]]
#     id                    string   — stable model id (matches ModelSpec.id
#                                      and the on-disk dir <root>/<id>/)
#     licence_url           string   — canonical upstream licence text URL
#     licence_sha256        string   — hex sha256 of the licence text the
#                                      operator reviews at acceptance. Stamped
#                                      into licence.accepted and enforced on
#                                      every subsequent start.
#     redistribution_policy string   — "redistributable" | "restricted"
#     target_arch           string   — "x86_64" | "aarch64" | "both"
#     [models.tensor_contract]
#       [models.tensor_contract.input]
#         shape           [u64]
#         dtype           string   — "f32" | "int8" | ...
#         normalisation   string   — short tag describing pre-processing
#       [models.tensor_contract.output]
#         shape           [u64]
#         dtype           string
#     [[models.variants]]
#       quant             string   — "fp32" | "int8"
#       source_url        string   — offline source for the bundled package
#                                    (file:// path to the installed model
#                                    store). Network fetch is never used at
#                                    install time — distro recipes bundle the
#                                    deterministic model archive produced by
#                                    packaging/build-model-archive.sh. The
#                                    upstream URL is recorded in the comment
#                                    above each variant for provenance only.
#       sha256            string   — hex sha256 of the variant's onnx file
#                                    (multiple variants per model_id supported;
#                                     INT8 quantisation may differ per arch —
#                                     add a separate variant when it does)
#
# Licence hashes below are the sha256 of the canonical licence text each model
# is distributed under, recorded so the acceptance record is reproducible.
# Canonical licence texts are installed in packaging/licences/ and their
# hashes are verified against this manifest at package build time.
# Task 6 (signed packages) pins the exact upstream licence file shipped with
# each model.

manifest_version = 1

# ---------------------------------------------------------------------------
# YuNet 2023mar — face detector (OpenCV Zoo, MIT)
# Licence text: packaging/licences/yunet_2023mar.LICENSE
# Upstream: https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
# ---------------------------------------------------------------------------
[[models]]
id = "yunet_2023mar"
licence_url = "https://raw.githubusercontent.com/opencv/opencv_zoo/main/models/face_detection_yunet/LICENSE"
licence_sha256 = "c83b8120c50ccbd4c4f96edf53141bdd566ebb8f8e9227e415326aa1b1aba958"
redistribution_policy = "redistributable"
target_arch = "both"

  [models.tensor_contract.input]
  shape = [1, 320, 320, 3]
  dtype = "f32"
  normalisation = "bgr_sub_mean_104_177_123"

  [models.tensor_contract.output]
  shape = [1, 2, 2100, 4]
  dtype = "f32"

  [[models.variants]]
  quant = "fp32"
  source_url = "file:///var/lib/namtor/models/yunet_2023mar.onnx"
  sha256 = "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4"

# ---------------------------------------------------------------------------
# SFace 2021dec — face embedding (OpenCV Zoo, Apache-2.0)
# Licence text: packaging/licences/sface_2021dec.LICENSE (= canonical Apache-2.0)
# Upstream: https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx
# ---------------------------------------------------------------------------
[[models]]
id = "sface_2021dec"
licence_url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
licence_sha256 = "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30"
redistribution_policy = "redistributable"
target_arch = "both"

  [models.tensor_contract.input]
  shape = [1, 112, 112, 3]
  dtype = "f32"
  normalisation = "bgr_sub_mean_127_5_scale_inv_std"

  [models.tensor_contract.output]
  shape = [1, 128]
  dtype = "f32"

  [[models.variants]]
  quant = "fp32"
  source_url = "file:///var/lib/namtor/models/sface_2021dec.onnx"
  sha256 = "0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79"

# ---------------------------------------------------------------------------
# MiniFASNet PAD — strobe-differential liveness (self-trained, Apache-2.0)
# Trained on physics-based synthetic strobe-differential data (AGENTS.md §M9).
# Code reference: Silent-Face (Apache-2.0); weights self-trained on synthetic
# differentials, no licence-restricted dataset derived.
# Licence text: packaging/licences/APACHE-2.0.txt
# Provenance notice: packaging/licences/minifasnet_pad.NOTICE
# Upstream: self-trained (no network source); bundled from the model store.
# ---------------------------------------------------------------------------
[[models]]
id = "minifasnet_pad"
licence_url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
licence_sha256 = "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30"
redistribution_policy = "redistributable"
target_arch = "both"

  [models.tensor_contract.input]
  shape = [1, 3, 96, 96]
  dtype = "f32"
  normalisation = "imagenet_mean_std"

  [models.tensor_contract.output]
  shape = [1, 2]
  dtype = "f32"

  [[models.variants]]
  quant = "fp32"
  source_url = "file:///var/lib/namtor/models/minifasnet_pad.onnx"
  sha256 = "686b6671578a1f6b7b8e018bf12136dfb4fd41671f5a377b96ce15c650306cf6"
