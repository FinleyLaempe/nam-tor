# Nam-tor system user and groups (sysusers.d)
#
# Creates:
#   - user  `namtor`      (daemon, no login, owns /var/lib/namtor)
#   - group `namtor-auth` (members may connect to the PAM socket)
#
# Supplementary group memberships (video, tss) are added via a separate
# drop-in so the base entry stays minimal and auditable.

u namtor - "Nam-tor daemon" /var/lib/namtor /usr/sbin/nologin
g namtor-auth -
m namtor video
m namtor tss
