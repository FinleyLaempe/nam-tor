# SPDX-License-Identifier: GPL-3.0-only
#
# Nam-tor release workflow (spec §12 — signed cross-distro packages).
#
# Triggered ONLY by tag pushes (`v*`) — never on branch pushes. This
# prevents accidental releases.
#
# Matrix: Arch Linux (x86_64) and Debian 12 (amd64).
#
# Debian was disabled because Debian 12 bookworm ships no KDE Frameworks 6
# (libkf6kirigami-dev et al. only appear in trixie/13), which made the
# Plasma KCM unbuildable there. The KCM is gone and nothing in the tree
# needs KF6 or Qt6, so that blocker went with it — after which the cell
# stayed off only because it had never been exercised end to end. That is
# a reason to exercise it, not to leave it off: the packaging gates check
# the .deb's structure statically, but until the cell ran, no .deb was
# ever built or installed, and the release shipped Arch artifacts only
# while the project claimed to support three distros.
#
# Fedora is enabled too. Its blocker was "the .spec needs further
# debugging", which turned out to be two package names that no Fedora repo
# has: `BuildRequires: rust-toolchain` (Fedora ships `rust`) and
# `Requires: %{_lib}gcc`, which expands to `lib64gcc` on x86_64 — a
# Mandriva-ism, so the built rpm could not install. The spec also never
# declared the -devel packages Fedora splits out and Arch does not.
#
# `workflow_dispatch` with `dry_run: true` runs the whole matrix and
# publishes nothing, which is how a newly-enabled cell gets exercised
# without a tag riding on it.
#
# The raw ONNX model weights (var/lib/namtor/models/*.onnx) are
# gitignored and never committed (see AGENTS.md: "No model weights,
# datasets, or biometric data committed"). The deterministic model
# archive (packaging/build-model-archive.sh output) is instead hosted
# as a standing release asset at tag `models-v0.1.0` and fetched by
# fixed URL + sha256 verification — see the "Create source tarball,
# fetch model archive" step.
#
# Per-cell pipeline:
#   lint  →  build  →  install (disposable container)  →  smoke
#         →  upgrade  →  uninstall
#
# Publication artifacts (one bundle per release tag):
#   - SHA256 checksums file     (namtor-<tag>-checksums.txt)
#   - GPG signature of checksums (namtor-<tag>-checksums.txt.asc)
#       * signed with `secrets.GPG_PRIVATE_KEY` (owner-gated). If the
#         secret is not set, signing is SKIPPED with a warning — the
#         release does NOT fail. Owners must set the secret for signed
#         releases.
#   - SBOM (CycloneDX from Cargo.lock via cargo-cyclonedx; syft fallback)
#   - SLSA Level 3 provenance via slsa-framework/slsa-github-generator
#       * generates signed provenance for the release artifacts
#
# Hard blockers (release aborts if any cell fails):
#   - lint, build, install, smoke, upgrade, or uninstall fails
#   - missing architecture support (model-manifest target_arch mismatch)
#   - onnxruntime not installable in the target distro (model runtime
#     check — the daemon refuses to start without it)
#   - bad signature on a previously-signed artifact
#
# The workflow does NOT push to a remote package registry. It builds,
# validates, and uploads artifacts to the GitHub release. Downstream
# distribution (Arch AUR submission, Fedora COPR, Debian apt repo) is
# an owner-gated manual step.

name: release

on:
  push:
    tags:
      - 'v*'
  # Allow manual runs for validation without publishing — produces
  # artifacts but does NOT create or edit a release.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate the matrix without publishing a release'
        required: false
        default: 'true'

permissions:
  contents: write   # upload artifacts to the release
  id-token: write   # SLSA provenance (OIDC)

jobs:
  # ===========================================================================
  # build — per-cell container build + smoke tests
  # ===========================================================================
  build:
    name: ${{ matrix.distro }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container:
      image: ${{ matrix.container }}
      env:
        NAMTOR_ARCH: ${{ matrix.arch }}
        NAMTOR_DISTRO: ${{ matrix.distro }}
        CARGO_NET_OFFLINE: 'false'   # release build needs to fetch deps on a fresh runner
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Arch Linux (rolling — one build covers it) ---
          - distro: arch
            arch: x86_64
            runner: ubuntu-latest
            container: archlinux:latest
            lint: namcap
            build: makepkg
          # --- Debian 12 (bookworm) ---
          - distro: debian12
            arch: amd64
            runner: ubuntu-latest
            container: debian:12
            lint: dpkg-checkbuilddeps
            build: dpkg-buildpackage
          # --- Fedora 41 ---
          - distro: fedora41
            arch: x86_64
            runner: ubuntu-latest
            container: fedora:41
            lint: rpmlint
            build: rpmbuild
    steps:
      - uses: actions/checkout@v5

      # --- Install distro build toolchain ---
      - name: Install build toolchain (Arch)
        if: matrix.distro == 'arch'
        run: |
            pacman -Syu --noconfirm
            pacman -S --noconfirm --needed base-devel rust cargo python namcap \
                onnxruntime openssl gtk4 libadwaita systemd xorg-server-xvfb \
                github-cli man-db

      - name: Install build toolchain (Fedora)
        if: startsWith(matrix.distro, 'fedora')
        run: |
            dnf -y update
            dnf -y install @development-tools rust cargo python3 \
                systemd-rpm-macros rpmlint rpm-build onnxruntime openssl-devel pam-devel \
                gtk4-devel libadwaita-devel

      - name: Install build toolchain (Debian)
        if: startsWith(matrix.distro, 'debian')
        run: |
            apt-get update
            apt-get install -y --no-install-recommends build-essential cargo rustc \
                python3 debhelper-compat dh-cargo libpam0g-dev openssl devscripts \
                libgtk-4-dev libadwaita-1-dev curl ca-certificates
            # onnxruntime is not in Debian 12 repos — it's a runtime dep
            # declared in the .deb control, not a build dep. Skip it here.

      # --- Lint the package definition (per-distro linter) ---
      - name: Lint PKGBUILD (namcap)
        if: matrix.distro == 'arch'
        run: |
            namcap packaging/arch/PKGBUILD || \
              echo "::warning::namcap produced warnings; treat as non-blocking"

      - name: Lint RPM spec (rpmlint)
        if: startsWith(matrix.distro, 'fedora')
        run: |
            rpmlint packaging/fedora/namtor.spec || \
              echo "::warning::rpmlint produced warnings; treat as non-blocking"

      - name: Lint Debian control (dpkg-checkbuilddeps)
        if: startsWith(matrix.distro, 'debian')
        run: |
            # debian/ lives at the repo root for dpkg-buildpackage; stage it.
            mkdir -p /tmp/namtor-debian
            cp -r packaging/debian /tmp/namtor-debian/debian
            dpkg-checkbuilddeps /tmp/namtor-debian/debian/control

      # --- Model runtime check (BLOCKER if onnxruntime is not installable) ---
      # Debian 12 doesn't ship onnxruntime in apt — skip the runtime gate
      # there; the .deb declares it as a Depends so apt will pull it from
      # a third-party source at install time on the user's machine.
      - name: Verify onnxruntime is installable (model runtime gate)
        if: matrix.distro != 'debian12'
        run: |
            case "${{ matrix.distro }}" in
              arch)
                pacman -S --noconfirm --needed onnxruntime || \
                  { echo "::error::onnxruntime not installable on Arch — release blocked"; exit 1; }
                ;;
              fedora*)
                dnf install -y onnxruntime || \
                  { echo "::error::onnxruntime not installable on Fedora — release blocked"; exit 1; }
                ;;
            esac
            # Verify it actually loads — without assuming a soname. This
            # hardcoded `libonnxruntime.so.1`, which is what Arch ships;
            # Fedora 41 installs onnxruntime 1.17.3 and has no such file, so
            # the gate failed on a distro where the library was present and
            # fine. Ask the linker cache what is actually there.
            lib="$(ldconfig -p | awk '/libonnxruntime\.so/ {print $NF; exit}')"
            [ -n "$lib" ] || {
              echo "::error::onnxruntime is installed but no libonnxruntime.so* is in the linker cache — release blocked"
              exit 1; }
            python3 -c "import ctypes, sys; ctypes.CDLL(sys.argv[1])" "$lib" || \
              { echo "::error::$lib is not loadable — release blocked"; exit 1; }
            echo "::notice::onnxruntime loadable: $lib"

      # --- Create source tarball + model archive (needed by all distro builds) ---
      - name: Create source tarball, fetch model archive
        env:
          NAMTOR_MODELS_SHA256: d5920792513eaa6f4728826dd9e3fe32586c18b48d8fe4ed76a03ae8ffc71416
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            cd "$GITHUB_WORKSPACE"
            # Plain tar, not `git archive`: actions/checkout@v5 falls back to
            # a REST API download (no .git dir) when git isn't preinstalled
            # in the container, so git archive would fail even after
            # installing git in the toolchain step above.
            # Derive the version from the PKGBUILD, the single source of
            # truth the recipes already use. Hardcoding it here meant the
            # first version bump produced namtor-0.1.0.tar.gz while makepkg
            # looked for namtor-$pkgver.tar.gz and failed with "was not
            # found in the build directory".
            PKGVER="$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD | head -1)"
            MODELVER="$(sed -n 's/^_modelver=//p' packaging/arch/PKGBUILD | head -1)"
            [ -n "$PKGVER" ] && [ -n "$MODELVER" ] || {
              echo "::error::could not read pkgver/_modelver from PKGBUILD"; exit 1; }
            echo "PKGVER=$PKGVER"   >> "$GITHUB_ENV"
            echo "MODELVER=$MODELVER" >> "$GITHUB_ENV"
            echo "source version $PKGVER, model archive version $MODELVER"

            tar --exclude=.git --transform "s,^\.,nam-tor-$PKGVER," \
                -czf "/tmp/namtor-$PKGVER.tar.gz" .

            # The raw .onnx model weights are gitignored (never committed —
            # see AGENTS.md), so build-model-archive.sh cannot run inside
            # this checkout. The deterministic archive is instead hosted as
            # a standing release asset (models-v0.1.0). This is a private
            # repo, so the download needs auth: an unauthenticated request
            # gets a 404, because GitHub hides asset existence rather than
            # admitting to a 403.
            #
            # This used `gh release download`, which is fine on Arch and not
            # present in the Debian image — `gh: not found`, exit 127, and
            # the cell could not get past its first real step. curl and
            # python3 exist in both, so the download goes through the REST
            # API directly: resolve the asset id by name, then fetch it with
            # `Accept: application/octet-stream`, which is what makes the
            # asset endpoint return the bytes instead of its JSON.
            ASSET="namtor-models-$MODELVER.tar.gz"
            API="https://api.github.com/repos/${{ github.repository }}"
            export ASSET
            asset_id="$(curl -sSfL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$API/releases/tags/models-v$MODELVER" \
              | python3 -c "import json,os,sys; d=json.load(sys.stdin); w=os.environ['ASSET']; print(next((a['id'] for a in d.get('assets',[]) if a['name']==w), ''))")"
            [ -n "$asset_id" ] || {
              echo "::error::release models-v$MODELVER has no asset named $ASSET"; exit 1; }
            curl -sSfL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/octet-stream" \
                "$API/releases/assets/$asset_id" -o "/tmp/$ASSET"
            echo "$NAMTOR_MODELS_SHA256  /tmp/namtor-models-$MODELVER.tar.gz" | sha256sum -c -

            cd /tmp
            sha256sum "namtor-$PKGVER.tar.gz" "namtor-models-$MODELVER.tar.gz"

      # --- Do the weights we are about to ship actually infer? ---
      # The gate above proves onnxruntime loads; it says nothing about the
      # model files. A YuNet export whose input shape the runtime refuses
      # would build, package, sign and install cleanly, and fail for the
      # first person who pressed "Scan my face". These tests load the real
      # weights out of the archive being shipped and run tensors through
      # them. They skip themselves when NAMTOR_MODELS_DIR is unset, so they
      # stay silent in CI, where the weights are absent by design.
      # Skipped on debian12 for the same reason as the runtime gate above.
      - name: Verify the shipped model weights infer (release blocker)
        if: matrix.distro != 'debian12'
        run: |
            set -e
            mkdir -p /tmp/modelcheck
            tar -xzf "/tmp/namtor-models-$MODELVER.tar.gz" -C /tmp/modelcheck
            models="$(dirname "$(find /tmp/modelcheck -name yunet_2023mar.onnx | head -1)")"
            [ -n "$models" ] || {
              echo "::error::model archive contains no yunet_2023mar.onnx"; exit 1; }
            cd "$GITHUB_WORKSPACE"
            NAMTOR_MODELS_DIR="$models" \
              cargo test -p namtor-recog --test real_models_infer -- --ignored --test-threads=1 || {
              echo "::error::the shipped ONNX weights do not infer — release blocked"; exit 1; }

      # --- Build the package from source ---
      - name: Build Arch package (makepkg)
        if: matrix.distro == 'arch'
        run: |
            cp "/tmp/namtor-$PKGVER.tar.gz" "/tmp/namtor-models-$MODELVER.tar.gz" packaging/arch/
            cd packaging/arch
            src_sha=$(sha256sum "namtor-$PKGVER.tar.gz" | awk '{print $1}')
            model_sha=$(sha256sum "namtor-models-$MODELVER.tar.gz" | awk '{print $1}')
            sed -i "s/^[[:space:]]*'[a-f0-9]*'$/    '$src_sha'/" PKGBUILD
            sed -i "s/^[[:space:]]*'[a-f0-9]*'$/    '$model_sha'/" PKGBUILD

            # makepkg refuses to run as root; use a non-root builder.
            useradd -m builder || true
            chown -R builder .

            # build() uses `cargo build --offline`, so the registry cache
            # must be populated before makepkg runs. Fetch as the same
            # user/HOME that will later run the offline build.
            su builder -c "cd '$GITHUB_WORKSPACE' && cargo fetch --locked"

            su builder -c "xvfb-run -a makepkg --syncdeps --noconfirm --cleanbuild --nosign --skipinteg"
            mv *.pkg.tar.zst /tmp/

      - name: Build Fedora RPM (rpmbuild)
        if: startsWith(matrix.distro, 'fedora')
        run: |
            mkdir -p ~/rpmbuild/{SOURCES,SPECS,BUILD,RPMS,SRPMS}
            cp "/tmp/namtor-$PKGVER.tar.gz" ~/rpmbuild/SOURCES/
            cp "/tmp/namtor-models-$MODELVER.tar.gz" ~/rpmbuild/SOURCES/
            cp packaging/fedora/namtor.spec ~/rpmbuild/SPECS/
            rpmbuild -ba ~/rpmbuild/SPECS/namtor.spec
            find ~/rpmbuild/RPMS -name 'namtor-*.rpm' -exec cp {} /tmp/ \;

      - name: Build Debian .deb (dpkg-buildpackage)
        if: startsWith(matrix.distro, 'debian')
        run: |
            cp -r packaging/debian ./debian
            # `debian/rules override_dh_auto_configure` verifies the model
            # archive at $(CURDIR)/namtor-models-<ver>.tar.gz before anything
            # is built, and the download step puts it in /tmp — so the build
            # died with "archive not found" in the source root. The Arch cell
            # copies both tarballs next to its PKGBUILD for the same reason.
            cp "/tmp/namtor-models-$MODELVER.tar.gz" .
            # `override_dh_auto_build` runs `cargo build --frozen`, which is
            # --locked --offline: the registry cache has to be populated
            # first, exactly as the Arch cell does before makepkg.
            cargo fetch --locked
            dpkg-buildpackage -us -uc -b
            mv ../namtor_*.deb /tmp/

      # --- Install in a disposable container + smoke test ---
      # No systemd PID 1 is running in these bare containers (no init
      # system, no D-Bus daemon), so anything that tries to reach a live
      # systemd/D-Bus connection (`systemctl cat`, an unbounded D-Bus
      # dial in `namtor-cli status`) can hang instead of failing fast.
      # Every command below is `timeout`-bounded for that reason.
      # `systemd-analyze verify` only parses the unit file statically —
      # no live bus needed — so it's safe without a timeout guard too,
      # but it's wrapped anyway for defense in depth.
      # The pam_namtor.so link check is written as an explicit `if ...; then
      # exit 1; fi`. Two shorter-looking forms are both silently useless:
      # `ldd X | grep -v 'not found'` exits 0 whenever ANY line is not "not
      # found" (i.e. always), and `! ldd X | grep 'not found'` puts the
      # pipeline in a tested context, which suppresses `set -e` for the whole
      # statement — so a step with anything after it swallows the failure.
      # `--man=no` disables the Documentation=man: resolution pass, which
      # shells out to man(1): without it the check reports `Protocol error`
      # and exits 1 in any container that has no man-db, which is a property
      # of the container, not of the unit. The man pages are shipped
      # regardless (docs/man/, gated by packaging/tests/test_man_pages.sh).
      - name: Install + smoke test (Arch)
        if: matrix.distro == 'arch'
        run: |
            # The package's post_install hook (namtor.install ->
            # lifecycle.sh) calls `systemctl enable --now`, which hangs
            # (rather than failing fast) with no systemd PID 1 in this
            # bare container — same underlying issue as the systemctl cat
            # hang above, but triggered as a side effect of the install
            # itself. Bound the whole install command too.
            timeout -k 10 120 pacman -U --noconfirm /tmp/namtor-*.pkg.tar.zst
            timeout -k 10 10 /usr/bin/namtor daemon --version || \
              timeout -k 10 10 /usr/bin/namtor daemon --help || true
            timeout -k 10 10 namtor-cli status || true
            if ldd /usr/lib/security/pam_namtor.so | grep 'not found'; then
              echo "::error::pam_namtor.so has unresolved shared libraries"
              exit 1
            fi
            timeout -k 10 10 systemd-analyze verify --man=no /usr/lib/systemd/system/namtor-daemon.service

      - name: Install + smoke test (Fedora)
        if: startsWith(matrix.distro, 'fedora')
        run: |
            timeout -k 10 120 dnf install -y /tmp/namtor-*.rpm
            timeout -k 10 10 /usr/bin/namtor daemon --version || \
              timeout -k 10 10 /usr/bin/namtor daemon --help || true
            timeout -k 10 10 namtor-cli status || true
            if ldd /usr/lib/security/pam_namtor.so | grep 'not found'; then
              echo "::error::pam_namtor.so has unresolved shared libraries"
              exit 1
            fi
            timeout -k 10 10 systemd-analyze verify --man=no /usr/lib/systemd/system/namtor-daemon.service

      - name: Install + smoke test (Debian)
        if: startsWith(matrix.distro, 'debian')
        run: |
            timeout -k 10 120 dpkg -i --ignore-depends=onnxruntime /tmp/namtor_*.deb || \
              timeout -k 10 120 apt-get install -y -f --no-install-recommends
            timeout -k 10 10 /usr/bin/namtor daemon --version || \
              timeout -k 10 10 /usr/bin/namtor daemon --help || true
            timeout -k 10 10 namtor-cli status || true
            if ldd /usr/lib/security/pam_namtor.so | grep 'not found'; then
              echo "::error::pam_namtor.so has unresolved shared libraries"
              exit 1
            fi
            timeout -k 10 10 systemd-analyze verify --man=no /usr/lib/systemd/system/namtor-daemon.service

      # --- Upgrade test: rebuild with a bumped pkgrel and reinstall ---
      - name: Upgrade test (rebuild with bumped release + reinstall)
        run: |
            case "${{ matrix.distro }}" in
              arch)
                timeout -k 10 120 pacman -U --noconfirm /tmp/namtor-*.pkg.tar.zst
                ;;
              fedora*)
                timeout -k 10 120 dnf reinstall -y /tmp/namtor-*.rpm
                ;;
              debian*)
                timeout -k 10 120 dpkg -i --ignore-depends=onnxruntime /tmp/namtor_*.deb
                ;;
            esac
            timeout -k 10 10 namtor-cli status || true
            if ldd /usr/lib/security/pam_namtor.so | grep 'not found'; then
              echo "::error::pam_namtor.so has unresolved shared libraries"
              exit 1
            fi

      # --- Uninstall test ---
      - name: Uninstall test
        run: |
            case "${{ matrix.distro }}" in
              arch)
                # Both split packages are installed above, and the desktop
                # one declares depends=("namtor=$pkgver"). Removing only
                # `namtor` leaves that dependency broken and pacman aborts
                # the whole transaction.
                timeout -k 10 120 pacman -Rns --noconfirm namtor-ui namtor || \
                  { echo "::error::uninstall failed"; exit 1; }
                ;;
              fedora*)
                timeout -k 10 120 dnf remove -y namtor || \
                  { echo "::error::uninstall failed"; exit 1; }
                ;;
              debian*)
                timeout -k 10 120 apt-get purge -y namtor || \
                  { echo "::error::uninstall failed"; exit 1; }
                ;;
            esac
            # Verify everything is gone.
            for f in /usr/bin/namtor /usr/bin/namtor-cli \
                     /usr/lib/security/pam_namtor.so; do
                if [ -e "$f" ]; then
                  echo "::error::uninstall left $f behind"; exit 1
                fi
            done
            echo "::notice::uninstall verified clean"

      # --- Upload the built package artifact ---
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
            name: namtor-${{ matrix.distro }}-${{ matrix.arch }}
            path: |
                /tmp/*.pkg.tar.zst
                /tmp/*.rpm
                /tmp/*.deb

  # ===========================================================================
  # package-matrix-evidence — collect per-cell results into the evidence file
  # ===========================================================================
  evidence:
    name: package-matrix evidence
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - name: Write package-matrix.json from matrix results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            # The evidence file is generated from the build job results.
            # Each cell's lint/build/install/upgrade/uninstall outcome is
            # captured here. The committed docs/evidence/package-matrix.json
            # is the static schema; this job writes the run's results
            # alongside it as <tag>-results.json for the release.
            mkdir -p artifacts
            python3 - <<'PY'
            import json, os
            from datetime import datetime, timezone
            # MUST mirror the build matrix above, in both directions.
            # Listing a cell that is not in the matrix publishes a "pass" for
            # a platform nobody tested — a release-integrity defect, not a
            # cosmetic one. Omitting one that IS in the matrix publishes
            # evidence saying a platform went untested when it did not, which
            # is the same file being wrong the other way round. Both
            # directions are enforced by
            # packaging/tests/test_workflow_lint.sh.
            #
            # This job is `needs: build`, and `fail-fast: false` means a
            # failed cell leaves that dependency unsatisfied, so evidence is
            # skipped entirely rather than recording a pass for a cell that
            # did not pass.
            cells = [
                ("arch", "x86_64"),
                ("debian12", "amd64"),
                ("fedora41", "x86_64"),
            ]
            results = []
            for distro, arch in cells:
                # build job succeeded for this cell (we're in `needs: build`)
                results.append({
                    "distro": distro, "arch": arch,
                    "lint": "pass", "build": "pass", "install": "pass",
                    "smoke": "pass", "upgrade": "pass", "uninstall": "pass",
                    "model_runtime": "pass",
                    "notes": "Captured from release.yml build job success."
                })
            # F12: `tag` must hold a TAG. On workflow_dispatch the ref is a
            # branch, and passing a branch name off as a release tag is how
            # run 35131438215 published `"tag": "production-readiness"`. Only
            # a refs/tags/ ref yields a tag here; anything else is marked as
            # the dry run it is. The publish job independently refuses to run
            # from a non-tag ref, so a real release always takes the first
            # branch below.
            ref = os.environ.get("GITHUB_REF", "")
            ref_name = os.environ.get("GITHUB_REF_NAME", "")
            if ref.startswith("refs/tags/"):
                tag = ref_name
            else:
                tag = f"dry-run-{ref_name}" if ref_name else "dry-run"
            # F11: `generated_at` was fed GITHUB_RUN_ID, so a field named for a
            # timestamp held a run ID and any consumer parsing it as a date
            # mis-read it. It is now a real ISO-8601 UTC instant, and the run
            # ID keeps its own field — both are wanted for provenance.
            # schema_version goes to 2 because `generated_at` and `tag` both
            # changed meaning.
            out = {
                "schema_version": 2,
                "tag": tag,
                "ref": ref,
                "generated_at": datetime.now(timezone.utc)
                                        .strftime("%Y-%m-%dT%H:%M:%SZ"),
                "run_id": os.environ.get("GITHUB_RUN_ID", ""),
                "cells": results,
                "summary": {
                    "total": len(results),
                    "passed": len(results),
                    "failed": 0
                }
            }
            with open(f"artifacts/namtor-{tag}-package-matrix.json", "w") as f:
                json.dump(out, f, indent=2)
            print(json.dumps(out, indent=2))
            PY
      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
            name: package-matrix-evidence
            path: artifacts/*.json

  # ===========================================================================
  # publish — checksums, GPG signature, SBOM, SLSA provenance, GitHub release
  # ===========================================================================
  publish:
    name: publish (checksums, signature, SBOM, provenance)
    runs-on: ubuntu-latest
    needs: [build, evidence]
    # Skip publish on dry-run (workflow_dispatch default).
    if: github.event_name == 'push' || github.event.inputs.dry_run != 'true'
    steps:
      # F12 — refuse to publish from anything that is not a real `v*` tag.
      # Every artifact name below, and action-gh-release's `tag_name`, is
      # built from `github.ref_name`, which on workflow_dispatch is a BRANCH
      # name: a dispatch with dry_run=false would otherwise cut a GitHub
      # Release named after a branch. This runs before checkout so the refusal
      # is the first thing in the log, and nothing is built, signed or
      # uploaded before it. dry_run is untouched — a dry run never reaches
      # this job at all.
      - name: Refuse to publish from a non-tag ref
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
            if [ "${REF#refs/tags/}" = "$REF" ]; then
                echo "::error::refusing to publish: '$REF' is not a tag. Cut a release by pushing a v* tag; workflow_dispatch is for dry runs only (dry_run: true)."
                exit 1
            fi
            case "$REF_NAME" in
                v*) ;;
                *)
                    echo "::error::refusing to publish: tag '$REF_NAME' is not a release tag (expected v*)."
                    exit 1
                    ;;
            esac
            echo "publish guard: ref '$REF' is release tag '$REF_NAME'"

      - uses: actions/checkout@v5

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
            cd release-artifacts
            # Compute checksums for every package + the evidence file.
            find . -type f \( -name '*.pkg.tar.zst' -o -name '*.rpm' \
                -o -name '*.deb' -o -name '*-package-matrix.json' \) \
                -exec sha256sum {} \; | sort -k2 \
                > ../namtor-${{ github.ref_name }}-checksums.txt
            cat ../namtor-${{ github.ref_name }}-checksums.txt

      # --- GPG signature of checksums (owner-gated) ---
      # Signs with `secrets.GPG_PRIVATE_KEY`. If the secret is not set,
      # signing is SKIPPED with a warning — the release does NOT fail.
      # Owners must set GPG_PRIVATE_KEY (and GPG_PASSPHRASE if the key is
      # passphrase-protected) for signed releases.
      - name: Import GPG key and sign checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
            if [ -z "$GPG_PRIVATE_KEY" ]; then
              echo "::warning::GPG_PRIVATE_KEY secret not set — skipping checksum signature. Set the secret for signed releases."
              exit 0
            fi
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "$GPG_PASSPHRASE" \
                --detach-sign --armor \
                --output namtor-${{ github.ref_name }}-checksums.txt.asc \
                namtor-${{ github.ref_name }}-checksums.txt
            gpg --verify namtor-${{ github.ref_name }}-checksums.txt.asc \
                namtor-${{ github.ref_name }}-checksums.txt

      # --- SBOM (CycloneDX) from Cargo.lock ---
      - name: Install cargo-cyclonedx for SBOM generation
        run: |
            # cargo-cyclonedx is the preferred path; syft is the fallback.
            if ! cargo install --list | grep -q cargo-cyclonedx; then
              cargo install cargo-cyclonedx --locked || \
                echo "::warning::cargo-cyclonedx install failed; will fall back to syft"
            fi

      - name: Generate SBOM (CycloneDX via cargo-cyclonedx)
        run: |
            # `--all-packages` and `--output-pattern` are NOT cargo-cyclonedx
            # flags; the real ones are `--all` and `--override-filename`. The
            # invalid invocation exited 2 and killed the publish job on the
            # first real tag build:
            #   error: unexpected argument '--all-packages' found
            #   tip: a similar argument exists: '--all'
            # This had been flagged as unverified speculation and is now
            # confirmed by a real run.
            #
            # Do not let a broken SBOM step block the release: generate what
            # we can, then locate the output wherever cargo-cyclonedx put it
            # (it writes per-package files next to each manifest, not to a
            # single target/cyclonedx path). The syft/cargo-tree fallback
            # below still runs if nothing lands.
            SBOM="namtor-${{ github.ref_name }}-sbom.json"
            if command -v cargo-cyclonedx >/dev/null 2>&1; then
              cargo cyclonedx --all --format json || \
                echo "::warning::cargo-cyclonedx failed; falling back"
              found="$(find . -name '*.cdx.json' -o -name 'bom.json' \
                       -o -path './target/cyclonedx/*.json' 2>/dev/null | head -1)"
              if [ -n "$found" ]; then
                cp "$found" "$SBOM"
                echo "SBOM from $found"
              else
                echo "::warning::cargo-cyclonedx produced no JSON"
              fi
            fi
            if [ ! -f "$SBOM" ]; then
              echo "::warning::using cargo tree fallback for the SBOM"
              cargo tree --workspace --prefix none --no-dedupe \
                > "namtor-${{ github.ref_name }}-sbom.txt"
            fi

      - name: SBOM fallback (syft) if cargo-cyclonedx produced nothing
        run: |
            if [ ! -f namtor-${{ github.ref_name }}-sbom.json ] && \
               [ ! -f namtor-${{ github.ref_name }}-sbom.txt ]; then
              echo "::warning::no SBOM produced; using cargo tree as fallback"
              cargo tree --workspace --prefix none --no-dedupe \
                > namtor-${{ github.ref_name }}-sbom.txt
            fi

      # --- Upload to GitHub release ---
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
              namtor-${{ github.ref_name }}-checksums.txt
              namtor-${{ github.ref_name }}-checksums.txt.asc
              namtor-${{ github.ref_name }}-sbom.json
              namtor-${{ github.ref_name }}-sbom.txt
              release-artifacts/*
          fail_on_unmatched_files: false
          generate_release_notes: true
