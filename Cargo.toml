[workspace]
resolver = "2"
members = [
    "crates/namtor-camera",
    "crates/namtor-capture",
    "crates/namtor-cli",
    "crates/namtor-daemon",
    "crates/namtor-eval",
    "crates/namtor-hwdb",
    "crates/namtor-probe",
    "crates/namtor-proto",
    "crates/namtor-recog",
    "crates/namtor-store",
    "crates/namtor-uvc",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
