[workspace]
resolver = "2"
members = [
    "crates/namtor-camera",
    "crates/namtor-capture",
    "crates/namtor-cli",
    "crates/namtor-client",
    "crates/namtor-collect",
    "crates/namtor-daemon",
    "crates/namtor-eval",
    "crates/namtor-gnome",
    "crates/namtor-hwdb",
    "crates/namtor-layout",
    "crates/namtor-pad",
    "crates/namtor-pam-config",
    "crates/namtor-pam",
    "crates/namtor-probe",
    "crates/namtor-proto",
    "crates/namtor-recog",
    "crates/namtor-store",
    "crates/namtor-uvc",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

# Spec §3.4: panic = "abort" for the PAM cdylib — unwinding across the C ABI
# into sudo is UB. Set workspace-wide; production code forbids unwrap/expect,
# so no crate relies on unwinding.
[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
