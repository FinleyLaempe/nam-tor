[workspace]
resolver = "2"
members = [
    "crates/namtor",
    "crates/namtor-camera",
    "crates/namtor-capture",
    "crates/namtor-cli",
    "crates/namtor-client",
    "crates/namtor-collect",
    "crates/namtor-daemon",
    "crates/namtor-eval",
    "crates/namtor-hwdb",
    "crates/namtor-layout",
    "crates/namtor-pad",
    "crates/namtor-pam-config",
    "crates/namtor-pam",
    "crates/namtor-probe",
    "crates/namtor-proto",
    "crates/namtor-recog",
    "crates/namtor-store",
    "crates/namtor-ui",
    "crates/namtor-uvc",
]

[workspace.package]
edition = "2021"
# Not 1.75, which this declared while being unbuildable on anything below
# 1.88. Cargo's own resolver settles it: on Debian 13's rustc 1.85.1 the
# build stops with "rustc 1.85.1 is not supported by the following packages:
# ort@2.0.0-rc.13 requires rustc 1.88 … zbus@5.18.0 requires rustc 1.87".
# The tree's own code agrees — `is_multiple_of` on integers is 1.87. A
# declared MSRV that is too low is a promise that breaks at the first
# `cargo build`, which is exactly how this was found.
rust-version = "1.88"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

# Spec §3.4: panic = "abort" for the PAM cdylib — unwinding across the C ABI
# into sudo is UB. Set workspace-wide; production code forbids unwrap/expect,
# so no crate relies on unwinding.
[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
